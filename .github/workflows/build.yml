name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tr1.jfrog.io NuGet source requires auth. Inject credentials from repo secrets
      # into the checked-out nuget.config (CI-only; the committed file stays credential-free).
      - name: Authenticate JFrog NuGet source
        run: >
          dotnet nuget update source "JFrog-Artifactory-Nuget-Audit-Devops"
          --username "${{ secrets.JFROG_USERNAME }}"
          --password "${{ secrets.JFROG_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
