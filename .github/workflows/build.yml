name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Authenticate the JFrog NuGet source (same URL as local dev) with credentials from repo
      # secrets. CI-only; committed nuget.config stays credential-free. JFROG_USERNAME is the
      # employee id (e.g. 0162913), JFROG_TOKEN a valid JFrog token for that user.
      - name: Authenticate JFrog NuGet source
        run: >
          dotnet nuget update source "JFrog-Artifactory-Nuget-Audit-Devops"
          --username "${{ secrets.JFROG_USERNAME }}"
          --password "${{ secrets.JFROG_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
