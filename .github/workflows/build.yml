name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Replace the JFrog NuGet source with the canonical Artifactory URL + credentials
      # from repo secrets (mirrors the Orchestrator CI). CI-only; committed nuget.config is
      # left credential-free so local builds use your own JFrog credentials.
      - name: Configure JFrog NuGet source
        run: |
          dotnet nuget remove source JFrog-Artifactory-Nuget-Audit-Devops || true
          dotnet nuget add source https://tr1.jfrog.io/artifactory/api/nuget/v3/nuget/index.json \
            --name tr-jfrog \
            --username "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_TOKEN }}" \
            --store-password-in-clear-text

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
